<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Reviewer — 流式代码审查</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #0d1117; color: #c9d1d9; min-height: 100vh; }

        .header { background: linear-gradient(135deg, #161b22, #1f2937); padding: 16px 24px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 12px; }
        .header h1 { font-size: 18px; color: #f0f6fc; }
        .header .badge { background: #7c3aed; color: #fff; font-size: 11px; padding: 3px 10px; border-radius: 12px; font-weight: 600; }
        .header .tag { background: #1f6feb33; color: #58a6ff; font-size: 11px; padding: 3px 8px; border-radius: 4px; }

        .main { display: flex; height: calc(100vh - 56px); }
        .left-panel { width: 50%; border-right: 1px solid #30363d; display: flex; flex-direction: column; }
        .right-panel { width: 50%; display: flex; flex-direction: column; }

        .input-header { padding: 12px 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
        .input-header label { font-size: 13px; color: #8b949e; }
        .input-header select, .input-header input { background: #161b22; border: 1px solid #30363d; color: #c9d1d9; padding: 4px 8px; border-radius: 6px; font-size: 13px; }
        .btn-review { background: #7c3aed; color: #fff; border: none; padding: 6px 16px; border-radius: 6px; cursor: pointer; font-size: 13px; font-weight: 600; margin-left: auto; }
        .btn-review:hover { background: #6d28d9; }
        .btn-review:disabled { background: #484f58; cursor: not-allowed; }

        .code-area { flex: 1; padding: 0; position: relative; }
        .code-area textarea { width: 100%; height: 100%; background: #0d1117; color: #c9d1d9; border: none; padding: 16px; font-family: 'SF Mono', 'Fira Code', 'Cascadia Code', Consolas, monospace; font-size: 13px; line-height: 1.6; resize: none; outline: none; tab-size: 4; }
        .code-area textarea::placeholder { color: #484f58; }

        .quick-examples { padding: 8px 16px; border-top: 1px solid #30363d; display: flex; gap: 6px; flex-wrap: wrap; }
        .quick-examples button { background: #161b22; border: 1px solid #30363d; color: #8b949e; padding: 4px 10px; border-radius: 4px; font-size: 12px; cursor: pointer; }
        .quick-examples button:hover { border-color: #7c3aed; color: #c9d1d9; }

        .output-header { padding: 12px 16px; border-bottom: 1px solid #30363d; display: flex; align-items: center; gap: 8px; }
        .output-header .title { font-size: 14px; font-weight: 600; color: #f0f6fc; }
        .output-header .streaming-indicator { display: none; width: 8px; height: 8px; background: #7c3aed; border-radius: 50%; animation: pulse 1s infinite; }
        .output-header .streaming-indicator.active { display: inline-block; }
        .output-header .time-badge { font-size: 12px; color: #8b949e; margin-left: auto; }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

        .output-area { flex: 1; overflow-y: auto; padding: 16px; }
        .output-content { font-size: 14px; line-height: 1.8; }
        .output-content h3 { color: #f0f6fc; margin: 16px 0 8px; font-size: 16px; border-bottom: 1px solid #21262d; padding-bottom: 4px; }
        .output-content strong { color: #f0f6fc; }
        .output-content blockquote { border-left: 3px solid #30363d; padding: 4px 12px; margin: 4px 0; color: #8b949e; background: #161b22; border-radius: 0 4px 4px 0; }
        .output-content code { background: #161b22; padding: 2px 6px; border-radius: 4px; font-family: 'SF Mono', 'Fira Code', Consolas, monospace; font-size: 12px; color: #e06c75; }
        .output-content ul, .output-content ol { padding-left: 20px; margin: 4px 0; }
        .output-content li { margin: 2px 0; }

        .placeholder { text-align: center; padding: 60px 20px; color: #484f58; }
        .placeholder .icon { font-size: 48px; margin-bottom: 12px; }
        .placeholder p { font-size: 14px; }

        .cursor::after { content: '▌'; color: #7c3aed; animation: blink 0.7s infinite; }
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }
    </style>
</head>
<body>
    <div class="header">
        <h1>📝 AI Code Reviewer</h1>
        <span class="badge">Streaming</span>
        <span class="tag">多维度审查</span>
        <span class="tag">SSE 实时输出</span>
    </div>

    <div class="main">
        <div class="left-panel">
            <div class="input-header">
                <label>语言:</label>
                <select id="language">
                    <option value="">自动检测</option>
                    <option value="php">PHP</option>
                    <option value="python">Python</option>
                    <option value="javascript">JavaScript</option>
                    <option value="sql">SQL</option>
                    <option value="java">Java</option>
                    <option value="go">Go</option>
                    <option value="rust">Rust</option>
                </select>
                <label>重点:</label>
                <select id="focus">
                    <option value="">全面审查</option>
                    <option value="security">安全问题</option>
                    <option value="performance">性能问题</option>
                    <option value="style">代码规范</option>
                </select>
                <button class="btn-review" id="btnReview" onclick="startReview()">开始审查</button>
            </div>
            <div class="code-area">
                <textarea id="codeInput" placeholder="在此粘贴或输入代码...

支持 PHP、Python、JavaScript、SQL、Java、Go、Rust 等任意语言

提示：点击下方快捷示例快速体验"></textarea>
            </div>
            <div class="quick-examples">
                <button onclick="loadExample('php')">PHP SQL注入</button>
                <button onclick="loadExample('python')">Python 性能</button>
                <button onclick="loadExample('js')">JS 异步</button>
                <button onclick="loadExample('laravel')">Laravel N+1</button>
            </div>
        </div>

        <div class="right-panel">
            <div class="output-header">
                <span class="streaming-indicator" id="streamDot"></span>
                <span class="title">审查报告</span>
                <span class="time-badge" id="timeBadge"></span>
            </div>
            <div class="output-area" id="outputArea">
                <div class="placeholder">
                    <div class="icon">🔍</div>
                    <p>在左侧输入代码，点击"开始审查"<br>AI 将实时流式输出审查报告</p>
                </div>
            </div>
        </div>
    </div>

<script>
const EXAMPLES = {
    php: `<?php
// 用户登录接口
function login($db, $username, $password) {
    $query = "SELECT * FROM users WHERE username = '$username' AND password = '$password'";
    $result = $db->query($query);
    $user = $result->fetch_assoc();

    if ($user) {
        $_SESSION['user_id'] = $user['id'];
        $_SESSION['role'] = $user['role'];
        echo json_encode(['success' => true, 'token' => md5($user['id'])]);
    } else {
        echo json_encode(['success' => false, 'error' => '用户名或密码错误']);
    }
}

// 获取用户列表
function getUsers($db) {
    $result = $db->query("SELECT * FROM users");
    $users = [];
    while ($row = $result->fetch_assoc()) {
        $users[] = $row;
    }
    return $users;
}`,

    python: `import requests
import json

def fetch_all_products(base_url):
    """获取所有商品数据"""
    products = []
    for i in range(1, 1001):
        response = requests.get(f"{base_url}/api/products/{i}")
        if response.status_code == 200:
            products.append(response.json())
    return products

def process_orders(orders):
    """处理订单列表"""
    result = []
    for order in orders:
        total = 0
        for item in order['items']:
            price = item.get('price', 0)
            quantity = item.get('quantity', 0)
            total += price * quantity

        discount = 0
        if total > 1000:
            discount = total * 0.1
        elif total > 500:
            discount = total * 0.05

        result.append({
            'order_id': order['id'],
            'total': total - discount,
            'status': 'processed'
        })

    f = open('orders.json', 'w')
    json.dump(result, f)
    return result`,

    js: `async function loadDashboard() {
    const users = await fetch('/api/users').then(r => r.json());
    const orders = await fetch('/api/orders').then(r => r.json());
    const products = await fetch('/api/products').then(r => r.json());

    let userStats = [];
    for (let i = 0; i < users.length; i++) {
        let userOrders = orders.filter(o => o.user_id == users[i].id);
        let total = 0;
        for (let j = 0; j < userOrders.length; j++) {
            total += userOrders[j].amount;
        }
        userStats.push({
            name: users[i].name,
            email: users[i].email,
            total: total,
            orderCount: userOrders.length
        });
    }

    document.getElementById('stats').innerHTML = userStats.map(s =>
        '<div>' + s.name + ': ¥' + s.total + '</div>'
    ).join('');

    setInterval(loadDashboard, 5000);
}

loadDashboard();`,

    laravel: `<?php
class ProductController extends Controller
{
    public function index()
    {
        $products = Product::all();
        $result = [];

        foreach ($products as $product) {
            $commentCount = Comment::where('product_id', $product->id)->count();
            $avgRating = Comment::where('product_id', $product->id)->avg('rating');
            $tags = DB::select("SELECT * FROM tags WHERE id IN (SELECT tag_id FROM product_tags WHERE product_id = " . $product->id . ")");

            $result[] = [
                'name' => $product->name,
                'price' => $product->price,
                'comment_count' => $commentCount,
                'avg_rating' => $avgRating,
                'tags' => $tags,
            ];
        }

        return response()->json($result);
    }
}`
};

function loadExample(key) {
    document.getElementById('codeInput').value = EXAMPLES[key];
    if (key === 'php' || key === 'laravel') {
        document.getElementById('language').value = 'php';
    } else if (key === 'python') {
        document.getElementById('language').value = 'python';
    } else if (key === 'js') {
        document.getElementById('language').value = 'javascript';
    }
}

function md2html(text) {
    return text
        .replace(/^### (.+)$/gm, '<h3>$1</h3>')
        .replace(/^## (.+)$/gm, '<h3>$1</h3>')
        .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
        .replace(/`([^`]+)`/g, '<code>$1</code>')
        .replace(/^> (.+)$/gm, '<blockquote>$1</blockquote>')
        .replace(/^- (.+)$/gm, '<li>$1</li>')
        .replace(/(<li>.*<\/li>\n?)+/g, '<ul>$&</ul>')
        .replace(/\n/g, '<br>');
}

async function startReview() {
    const code = document.getElementById('codeInput').value.trim();
    if (!code) { alert('请输入代码'); return; }

    const language = document.getElementById('language').value;
    const focus = document.getElementById('focus').value;
    const btn = document.getElementById('btnReview');
    const output = document.getElementById('outputArea');
    const dot = document.getElementById('streamDot');
    const timeBadge = document.getElementById('timeBadge');

    btn.disabled = true;
    btn.textContent = '审查中...';
    dot.classList.add('active');
    output.innerHTML = '<div class="output-content cursor" id="streamContent"></div>';
    timeBadge.textContent = '';

    const startTime = Date.now();
    let fullText = '';

    try {
        const response = await fetch('/review-stream', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ code, language: language || null, focus: focus || null }),
        });

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        const contentEl = document.getElementById('streamContent');

        while (true) {
            const { done, value } = await reader.read();
            if (done) break;

            const chunk = decoder.decode(value, { stream: true });
            fullText += chunk;
            contentEl.innerHTML = md2html(fullText);
            output.scrollTop = output.scrollHeight;
            timeBadge.textContent = ((Date.now() - startTime) / 1000).toFixed(1) + 's';
        }

        contentEl.classList.remove('cursor');
    } catch (err) {
        output.innerHTML = '<div class="placeholder"><div class="icon">❌</div><p>' + err.message + '</p></div>';
    } finally {
        btn.disabled = false;
        btn.textContent = '开始审查';
        dot.classList.remove('active');
        timeBadge.textContent += ' 完成';
    }
}
</script>
</body>
</html>
